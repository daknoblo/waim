# Renders the UI with sample data and publishes it as the GitHub Pages demo.
name: Deploy Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer commit supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Render Static Demo
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Check out repository"
        uses: actions/checkout@v7

      - name: "\U0001F527 Set up Go (version from go.mod, with module cache)"
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "\U0001F3A8 Render the demo site"
        run: go run ./cmd/demo -out dist

      - name: "\U0001F4E4 Upload Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "\U0001F680 Deploy"
        id: deployment
        uses: actions/deploy-pages@v5
