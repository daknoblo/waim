# Builds the multi-arch Docker image, publishes it to GitHub Container Registry
# (main -> :latest, tags -> versioned), scans it for vulnerabilities and opens a
# GitHub Release for feature versions.
name: Publish Release (ghcr.io)

on:
  push:
    branches: [main]
    # Release tags are plain semver (1.2.3) to match the published image tags.
    # v-prefixed tags stay accepted so an out-of-habit `v1.2.3` still publishes
    # instead of silently doing nothing.
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build, Push & Scan Image
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Check out repository"
        uses: actions/checkout@v7

      - name: "\U0001F9F0 Set up QEMU (multi-arch emulation)"
        uses: docker/setup-qemu-action@v4

      - name: "\U0001F3D7\uFE0F Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "\U0001F510 Log in to GitHub Container Registry"
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "\U0001F551 Compute build version"
        id: buildmeta
        # Tag builds report the release version, so the About page and the
        # startup log match the image tag. Branch builds keep a build stamp.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(date -u +%Y%m%d-%H%M)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build version: $version"

      - name: "\U0001F3F7\uFE0F Determine image tags & labels"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: "\U0001F433 Build & push multi-arch image (amd64 + arm64)"
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "\U0001F6E1\uFE0F Scan image for vulnerabilities (Trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: "\U0001F4E4 Upload scan results to the Security tab"
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  release:
    name: Create GitHub Release
    # Only feature versions (X.Y.0) get a release page. Patch tags such as
    # 1.1.7 still publish an image, they just do not add release noise.
    if: github.ref_type == 'tag' && endsWith(github.ref_name, '.0')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "\U0001F4E5 Check out repository"
        uses: actions/checkout@v7
        with:
          # Full history and tag objects, so the annotated tag message is readable.
          fetch-depth: 0

      - name: "\U0001F4DD Publish the release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Annotated tags carry hand-written notes; lightweight ones fall back
          # to the changelog GitHub generates from the commits.
          if [ "$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')" = "tag" ]; then
            notes=--notes-from-tag
          else
            notes=--generate-notes
          fi
          gh release create "$TAG" --verify-tag --title "waim ${TAG#v}" "$notes"
