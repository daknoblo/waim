# Builds the multi-arch Docker image, publishes it to GitHub Container Registry
# (main -> :latest, develop -> :dev, approved tags -> versioned), scans it for
# vulnerabilities and opens a GitHub Release for every version.
name: Publish Release (ghcr.io)

on:
  push:
    branches: [main, develop]
    # Release tags are plain semver (1.2.3) to match the published image tags.
    # v-prefixed tags stay accepted so an out-of-habit `v1.2.3` still publishes
    # instead of silently doing nothing.
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channel:
    name: Validate release channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject version tags outside main
        id: channel
        run: bash scripts/release-channel.sh >> "$GITHUB_OUTPUT"

  verify:
    name: Verify before publishing
    needs: channel
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, Push & Scan Image
    needs: [channel, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: "\U0001F4E5 Check out repository"
        uses: actions/checkout@v7

      - name: "\U0001F9F0 Set up QEMU (multi-arch emulation)"
        uses: docker/setup-qemu-action@v4

      - name: "\U0001F3D7\uFE0F Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "\U0001F510 Log in to GitHub Container Registry"
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: buildmeta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: "\U0001F3F7\uFE0F Determine image tags & labels"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Never let semver metadata implicitly move :latest.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-dev-,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: "\U0001F433 Build & push multi-arch image (amd64 + arm64)"
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.channel.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.buildmeta.outputs.date }}
          cache-from: type=gha,scope=${{ needs.channel.outputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ needs.channel.outputs.channel }}

      - name: "\U0001F6E1\uFE0F Scan image for vulnerabilities (Trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: "\U0001F4E4 Upload scan results to the Security tab"
        uses: github/codeql-action/upload-sarif@v4.38.0
        if: always()
        with:
          sarif_file: trivy-results.sarif

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "\U0001F4E5 Check out repository"
        uses: actions/checkout@v7
        with:
          # Full history and tag objects, so the annotated tag message is readable.
          fetch-depth: 0

      - name: "\U0001F4DD Publish the release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Annotated tags carry hand-written notes; lightweight ones fall back
          # to the changelog GitHub generates from the commits.
          if [ "$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')" = "tag" ]; then
            notes=--notes-from-tag
          else
            notes=--generate-notes
          fi
          gh release create "$TAG" --verify-tag --target main --title "waim ${TAG#v}" "$notes"
