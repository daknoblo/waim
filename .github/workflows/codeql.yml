# Static analysis of the Go sources and the workflow files themselves.
#
# This complements the Trivy scan in release.yml: Trivy looks for known CVEs in
# the packages of the built image, CodeQL analyses the code we write. Results
# from both land in the repository's Security tab.
name: CodeQL (Static Analysis)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Query packs improve over time, so re-scan unchanged code once a week.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the results to the Security tab.
      security-events: write
      # Required by the "actions" language to read the workflow definitions.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: "\U0001F4E5 Check out repository"
        uses: actions/checkout@v7

      # Pin the same toolchain the rest of the CI uses; autobuild would
      # otherwise fall back to whatever Go version the runner ships.
      - name: "\U0001F527 Set up Go (version from go.mod, with module cache)"
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "\U0001F9F0 Initialise CodeQL"
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: "\U0001F50E Perform CodeQL analysis"
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
