# Runs on every push and pull request to validate code quality before merge:
# checks generated assets, lints, runs tests and compiles the project.
name: Code Checks (Lint, Test & Build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Check out repository"
        uses: actions/checkout@v7
        with:
          # Full history so the version check below can see the release tags.
          fetch-depth: 0

      - name: "\U0001F527 Set up Go (version from go.mod, with module cache)"
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "\U0001F4E6 Install templ code generator"
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: "\U0001F50D Check generated templ code is committed"
        run: |
          templ generate
          git diff --exit-code -- '*_templ.go' \
            || (echo "::error::Generated templ code is stale. Run 'make generate' and commit the result." && exit 1)

      - name: "\U0001F50D Check compiled Tailwind CSS is committed"
        run: |
          curl -fsSL https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64 -o tailwindcss
          chmod +x tailwindcss
          ./tailwindcss -c tailwind.config.js -i internal/web/assets/input.css -o internal/web/assets/static/app.css --minify
          git diff --exit-code -- internal/web/assets/static/app.css \
            || (echo "::error::Compiled app.css is stale. Run 'make css' and commit the result." && exit 1)

      - name: "\U0001F50D Check the documented image version matches the latest feature release"
        run: |
          # ghcr.io only carries plain semver tags: docker/metadata-action's
          # {{version}} strips a leading "v", so ":v1.2.3" would be a 404.
          if grep -rnE 'ghcr\.io/daknoblo/waim:v[0-9]' README.md docs/; then
            echo "::error::Docs pin a v-prefixed image tag, but ghcr.io publishes plain semver tags (e.g. 1.2.3)."
            exit 1
          fi
          # Patch tags are test builds and never reach the docs, so only X.Y.0
          # counts here.
          latest=$(git tag --list | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.0$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "No feature release tag yet — nothing to check."
            exit 0
          fi
          documented=$(grep -rhoE 'ghcr\.io/daknoblo/waim:[0-9]+\.[0-9]+\.[0-9]+' README.md docs/ \
            | sed 's/.*://' | sort -u || true)
          if [ -z "$documented" ]; then
            echo "No pinned version referenced in the docs — nothing to check."
            exit 0
          fi
          if [ "$documented" != "$latest" ]; then
            echo "::error::Docs pin $(echo "$documented" | tr '\n' ' ')but the latest feature release is $latest. Run 'make docs-version VERSION=$latest' and commit the result."
            exit 1
          fi
          echo "Docs pin $latest — up to date."

      - name: "\U0001F9EA Static analysis (go vet)"
        run: go vet ./...

      - name: "\U0001F9F9 Lint (golangci-lint)"
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: "\u2705 Run tests (with race detector)"
        run: go test -race ./...

      - name: "\U0001F528 Compile static binary"
        run: CGO_ENABLED=0 go build ./...
