# Example docker-compose setup for waim.
#
# 1. Copy this file to docker-compose.yml.
# 2. Pin a tag if you want reproducible deploys (`X.Y.Z` or `sha-…`);
#    `latest` tracks approved stable builds of main.
#    To test `dev`, use a separate container, port and data volume.
# 3. Configure Jellyfin and TMDB in the web UI at http://<host>:8080.
# Prepare ./appdata with write access for UID/GID 65532 before starting.
# The host directory stays ./appdata; only the container path is /data.
# Older images use /appdata instead; see docs/installation.md before upgrading.
#
# The key used to encrypt the stored API keys is generated on first start and
# kept in the data volume as master.key — keep that volume (and treat backups
# of it as secret), otherwise the API keys have to be entered again.

services:
  waim:
    image: ghcr.io/daknoblo/waim:latest
    container_name: waim
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WAIM_ADDR: ":8080"
      # Timezone for the database timestamps and log display (IANA name).
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - type: bind
        source: ./appdata
        target: /data
        bind:
          create_host_path: false
    # Security hardening: run with a read-only root filesystem; only the
    # mounted data volume (and an in-memory /tmp) are writable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
